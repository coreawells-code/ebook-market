<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Nebula Swarm</title>
    <meta name="description" content="Blast swooping alien swarms in this retro pixel arcade shooter." />
    <meta property="og:title" content="Nebula Swarm" />
    <meta property="og:description" content="Blast swooping alien swarms in this retro pixel arcade shooter. Chase the top pilot score!" />
    <meta property="og:image" content="https://nebula-swarm-300007.higgsfield.app/cover.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --bg: #05040d; --fg: #f4f7ff; --dim: #8b8d94; --cyan: #38e8ff; --pink: #ff3fc8; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font-family: "Press Start 2P", monospace;
        background: radial-gradient(ellipse at 50% 30%, #1a0b3a 0%, var(--bg) 70%);
        padding: 12px 16px;
        touch-action: none;
      }
      #frame {
        position: relative;
        height: min(calc(100dvh - 60px), calc((100vw - 32px) * 4 / 3));
        aspect-ratio: 3 / 4;
        border: 2px solid #2a1f55;
        border-radius: 6px;
        box-shadow: 0 0 24px rgba(56, 232, 255, 0.25), 0 0 60px rgba(255, 63, 200, 0.15);
        overflow: hidden;
      }
      canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
      #help { font-size: 9px; color: var(--dim); text-align: center; line-height: 1.6; }
      #help b { color: var(--cyan); font-weight: normal; }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="game" aria-label="Nebula Swarm game screen"></canvas></div>
    <p id="help"><b>←/→</b> 이동 · <b>SPACE</b> 발사 · <b>P</b> 일시정지 · <b>M</b> 음소거 · 모바일: 드래그</p>
    <script type="module" src="client.js"></script>
  </body>
</html>
